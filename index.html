<style>

:root{

  --ok:#0b7f55; --ok-soft:#daf3e7; --warn:#9c5a06; --warn-soft:#fdf0d8; --bad:#c0392f; --bad-soft:#fbe3e1; --info:#5b3fd1; --info-soft:#ece8fd;
  --ph-top:#1972f9; --ph-bg:#ffffff; --ph-ink:#13213f; --ph-muted:#6b7690; --ph-line:#e9edf4; --ph-soft:#f4f7fc;
  --display:"Karla",ui-sans-serif,system-ui,sans-serif; --head:"Poppins","Karla",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

  --accent:#518ffb; --accent-ink:#06132e; --accent-soft:#163a7a;
  --rail:#041027; --rail-ink:#a9bde6; --rail-hi:#ffffff; --rail-sel:#163a7a; --top:#041a45; --top-ink:#ffffff; --brand:#518ffb; --brand2:#1972f9;
  --ok:#3fcf95; --ok-soft:#0f3a2c; --warn:#f3b04f; --warn-soft:#3a2a10; --bad:#ff8077; --bad-soft:#3d1a1b; --info:#ae9cff; --info-soft:#241d4d;
  --ph-top:#2c6cf0; --ph-bg:#0e1628; --ph-ink:#e6ebf5; --ph-muted:#94a0ba; --ph-line:#1f2a42; --ph-soft:#152036; color-scheme:dark}}

  --ok:#3fcf95; --ok-soft:#0f3a2c; --warn:#f3b04f; --warn-soft:#3a2a10; --bad:#ff8077; --bad-soft:#3d1a1b; --info:#ae9cff; --info-soft:#241d4d;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}

.plogo{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}

.sticky{position:sticky;top:76px}
@media (max-width:1180px){.sticky{position:static}}
h1{font-family:var(--head);font-weight:600;font-size:23px;letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.25}

.ok{background:var(--ok-soft);color:var(--ok)} .warn{background:var(--warn-soft);color:var(--warn)} .bad{background:var(--bad-soft);color:var(--bad)} .acc{background:var(--accent-soft);color:var(--accent)} .mute{background:var(--soft);color:var(--muted)} .inf{background:var(--info-soft);color:var(--info)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

 const tl=`<div class="card"><div class="row sb"><h2>When each API runs</h2><span class="sm faint">${pr.apis.length} calls</span></div>

  <p class="sm faint">Field-change triggers suit lookups such as plate number to vehicle details. To trigger from a button, add a Button in the form builder with “Run API calls”.</p></div>`;

 return`${c.length?`<details class="issues"><summary><span class="pill ${worst(c)==='bad'?'bad':'warn'}">${c.length} issue${c.length>1?'s':''}</span> in integration</summary>${checkList(c)}</details>`:''}
